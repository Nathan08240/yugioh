<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060817" />
    <title>Duel Monsters</title>
    <style>
      /* Page de secours du service worker : autonome, aux couleurs de la charte (tokens.css). */
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        background: radial-gradient(circle at 50% 30%, #1f2760, #0b1030 60%, #060817);
        color: #eef1ff;
        font: 500 1rem/1.5 Barlow, system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      svg {
        width: 96px;
        height: 96px;
        fill: none;
        stroke-linejoin: round;
      }
      h1 {
        margin: 16px 0 8px;
        font: 800 1.5rem/1.2 Tektur, system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 24px;
        color: #b4bce3;
      }
      button {
        min-height: 44px;
        padding: 0 32px;
        border: 0;
        background: #ffc53d;
        color: #150f00;
        font: 700 1rem/1 "Barlow Condensed", system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #43f0ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- L'emblème du jeu en ligne : hors connexion, aucune image ne se charge. -->
      <svg viewBox="3 2 18 20" aria-hidden="true">
        <path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" stroke="#43f0ff" stroke-width="1.2" />
        <path d="M12 7l4.3 2.5v5L12 17l-4.3-2.5v-5z" stroke="#7df7ff" stroke-width="1.2" />
        <circle cx="12" cy="12" r="1.9" fill="#ffc53d" />
      </svg>
      <h1>Connexion nécessaire pour jouer</h1>
      <p>Duel Monsters se joue en ligne. Vérifiez votre connexion internet : le jeu se rouvrira dès qu'elle revient.</p>
      <button type="button" id="reessayer">Réessayer</button>
    </main>
    <script>
      document.getElementById("reessayer").onclick = () => location.reload();
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
